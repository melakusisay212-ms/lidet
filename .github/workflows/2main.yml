name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

           # Capacitor 7 needs JDK 21 for the Android build.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner already ships the Android SDK; just make sure licenses are accepted.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests (Ethiopian calendar, reminders, habits, backup)
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Add reminder permissions to the Android manifest
        run: node scripts/patch-android.cjs

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zemen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
